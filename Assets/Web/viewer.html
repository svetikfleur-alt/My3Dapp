<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My3DApp Viewport</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0D0D1A; }
  #canvas-container { width: 100%; height: 100%; }
  #status { position: fixed; bottom: 4px; left: 8px; color: #445566; font: 11px monospace; pointer-events: none; }
  #viewcube { position: fixed; top: 8px; left: 8px; width: 76px; height: 76px; cursor: pointer; border-radius: 6px; }
  #vp-controls {
    position: fixed; top: 8px; right: 8px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .vp-btn {
    width: 28px; height: 28px;
    background: rgba(13,27,42,0.82);
    color: #6b8cae;
    border: 1px solid #1e3050;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .vp-btn:hover { background: #1e3a5f; color: #a0bcd8; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="status">Loading Three.js...</div>
<canvas id="viewcube" width="76" height="76" title="Click to reset view"></canvas>

<div id="vp-controls">
  <button class="vp-btn" title="Fit to scene"  onclick="viewer.fitView()">⊞</button>
  <button class="vp-btn" title="Reset view"    onclick="viewer.resetView()">⌖</button>
  <button class="vp-btn" title="Wireframe"     onclick="viewer.setWireframe(true)">□</button>
  <button class="vp-btn" title="Solid view"    onclick="viewer.setWireframe(false)">◼</button>
  <button class="vp-btn" title="Front view"    onclick="viewer.setView('front')">F</button>
  <button class="vp-btn" title="Top view"      onclick="viewer.setView('top')">T</button>
  <button class="vp-btn" title="Isometric"     onclick="viewer.setView('iso')">⬡</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

// ── Scene setup ───────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const statusEl  = document.getElementById('status');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0D0D1A);
scene.fog = new THREE.Fog(0x0D0D1A, 500, 2000);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 5000);
camera.position.set(200, 150, 300);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 5;
controls.maxDistance = 2000;

// ── Lighting (3-point rig) ────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x334466, 1.2);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xfff8f0, 2.2);
keyLight.position.set(300, 500, 250);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(4096, 4096);
keyLight.shadow.camera.near = 10;
keyLight.shadow.camera.far  = 3000;
keyLight.shadow.camera.left = keyLight.shadow.camera.bottom = -400;
keyLight.shadow.camera.right = keyLight.shadow.camera.top  =  400;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8ab4e8, 0.6);
fillLight.position.set(-250, 100, -200);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffd0a0, 0.35);
rimLight.position.set(0, -200, -300);
scene.add(rimLight);

// Ground shadow receiver
const groundGeo = new THREE.PlaneGeometry(2000, 2000);
const groundMat = new THREE.ShadowMaterial({ opacity: 0.18 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ── Grid & labelled axes ──────────────────────────────────────────────────────
const grid = new THREE.GridHelper(500, 50, 0x1E3050, 0x162438);
scene.add(grid);

function addAxisLine(from, to, color) {
  const mat = new THREE.LineBasicMaterial({ color, linewidth: 2 });
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  scene.add(new THREE.Line(geo, mat));
}
// Positive axes solid, negative dashed-like (shorter)
addAxisLine(new THREE.Vector3(0,0,0), new THREE.Vector3(80,0,0),  0xff4444);
addAxisLine(new THREE.Vector3(0,0,0), new THREE.Vector3(-30,0,0), 0x882222);
addAxisLine(new THREE.Vector3(0,0,0), new THREE.Vector3(0,80,0),  0x44ff44);
addAxisLine(new THREE.Vector3(0,0,0), new THREE.Vector3(0,-30,0), 0x228822);
addAxisLine(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,80),  0x4488ff);
addAxisLine(new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-30), 0x224488);

// Axis labels (sprites)
function makeAxisLabel(text, position, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = 'bold 48px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 32, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.position.copy(position);
  sprite.scale.set(12, 12, 1);
  scene.add(sprite);
}
makeAxisLabel('X', new THREE.Vector3(92, 0, 0),  '#ff6666');
makeAxisLabel('Y', new THREE.Vector3(0, 92, 0),  '#66ff66');
makeAxisLabel('Z', new THREE.Vector3(0, 0, 92),  '#6699ff');

// ── Default part material ─────────────────────────────────────────────────────
const defaultMaterial = new THREE.MeshStandardMaterial({
  color: 0x3a7bc8,
  roughness: 0.28,
  metalness: 0.62,
  envMapIntensity: 1.0,
});
const wireframeMaterial = new THREE.MeshBasicMaterial({ color: 0x88aacc, wireframe: true });

let isWireframe = false;
const meshObjects = {};
let _selectedMesh = null; // currently highlighted mesh

// ── Viewer API (called by C# via ExecuteScriptAsync) ──────────────────────────
window.viewer = {

  // Adds a semi-transparent sketch plane indicator (flat XZ-plane rectangle).
  addSketchPlane(name, w = 120, d = 120, x = 0, y = 0, z = 0) {
    const geo = new THREE.PlaneGeometry(w, d);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x4488ff, transparent: true, opacity: 0.18,
      side: THREE.DoubleSide, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(x, y, z);
    mesh.name = name;
    scene.add(mesh);
    meshObjects[name] = mesh;

    const edgesGeo = new THREE.EdgesGeometry(geo);
    const edgesMat = new THREE.LineBasicMaterial({ color: 0x6699ff });
    const edges = new THREE.LineSegments(edgesGeo, edgesMat);
    edges.rotation.x = -Math.PI / 2;
    edges.position.set(x, y, z);
    edges.name = name + '_edges';
    scene.add(edges);

    setStatus(`Sketch plane "${name}" @ (${x},${y},${z})`);
  },

  // Moves an existing object to a new position.
  moveObject(name, x, y, z) {
    const obj = meshObjects[name];
    if (obj) { obj.position.set(x, y, z); setStatus(`Moved "${name}" to (${x},${y},${z})`); }
  },

  addBox(name, w = 100, h = 50, d = 30, x = 0, y = 0, z = 0) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mesh = new THREE.Mesh(geo, isWireframe ? wireframeMaterial.clone() : defaultMaterial.clone());
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.position.set(x, y, z);
    mesh.name = name;
    scene.add(mesh);
    meshObjects[name] = mesh;
    setStatus(`Added box "${name}" [${w}×${h}×${d}] @ (${x},${y},${z})`);
  },

  addCylinder(name, radius = 30, height = 60, segments = 32, x = 0, y = 0, z = 0) {
    const geo = new THREE.CylinderGeometry(radius, radius, height, segments);
    const mesh = new THREE.Mesh(geo, isWireframe ? wireframeMaterial.clone() : defaultMaterial.clone());
    mesh.castShadow = true;
    mesh.position.set(x, y, z);
    mesh.name = name;
    scene.add(mesh);
    meshObjects[name] = mesh;
    setStatus(`Added cylinder "${name}" r=${radius} h=${height} @ (${x},${y},${z})`);
  },

  addSphere(name, radius = 40, segments = 32, x = 0, y = 0, z = 0) {
    const geo = new THREE.SphereGeometry(radius, segments, segments);
    const mesh = new THREE.Mesh(geo, isWireframe ? wireframeMaterial.clone() : defaultMaterial.clone());
    mesh.castShadow = true;
    mesh.position.set(x, y, z);
    mesh.name = name;
    scene.add(mesh);
    meshObjects[name] = mesh;
    setStatus(`Added sphere "${name}" r=${radius} @ (${x},${y},${z})`);
  },

  // Extrudes a closed 2D polygon on the XZ plane.
  // points = flat array [x0,z0, x1,z1, ...] in mm. Solid centred at (x,y,z).
  extrudePolygon(name, points, depth, x = 0, y = 0, z = 0) {
    const shape = new THREE.Shape();
    shape.moveTo(points[0], points[1]);
    for (let i = 2; i < points.length; i += 2) shape.lineTo(points[i], points[i+1]);
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
    geo.rotateX(-Math.PI / 2);                   // XZ profile → stands upright on Y axis
    geo.translate(0, -depth / 2, 0);              // centre vertically
    const mesh = new THREE.Mesh(geo, isWireframe ? wireframeMaterial.clone() : defaultMaterial.clone());
    mesh.castShadow = true;
    mesh.position.set(x, y, z);
    mesh.name = name;
    scene.add(mesh);
    meshObjects[name] = mesh;
    setStatus(`Extruded "${name}" depth=${depth}mm @ (${x},${y},${z})`);
  },

  // Revolves a 2D profile around the Y axis.
  // profile = flat array [r0,y0, r1,y1, ...] in mm. Solid centred at (x,y,z).
  revolveProfile(name, profile, angle = 360, segments = 32, x = 0, y = 0, z = 0) {
    const pts = [];
    for (let i = 0; i < profile.length; i += 2) pts.push(new THREE.Vector2(profile[i], profile[i+1]));
    const geo = new THREE.LatheGeometry(pts, segments, 0, angle * Math.PI / 180);
    const mesh = new THREE.Mesh(geo, isWireframe ? wireframeMaterial.clone() : defaultMaterial.clone());
    mesh.castShadow = true;
    mesh.position.set(x, y, z);
    mesh.name = name;
    scene.add(mesh);
    meshObjects[name] = mesh;
    setStatus(`Revolved "${name}" ${angle}° @ (${x},${y},${z})`);
  },

  // Boolean union: both solids remain visible; export already merges all solids.
  booleanUnion(resultName, nameA, nameB) {
    setStatus(`Union "${resultName}": ${nameA} ∪ ${nameB} — merged on export`);
  },

  // Boolean subtract: tool body shown ghosted; full CSG on export via PicoGK.
  booleanSubtract(resultName, targetName, toolName) {
    const tool = meshObjects[toolName];
    if (tool) {
      tool.material = new THREE.MeshStandardMaterial({
        color: 0xff3333, transparent: true, opacity: 0.25, depthWrite: false
      });
    }
    setStatus(`Subtract "${resultName}": ${targetName} − ${toolName} (preview)`);
  },

  // Boolean intersect: both bodies shown ghosted to indicate intersection region.
  booleanIntersect(resultName, nameA, nameB) {
    [nameA, nameB].forEach(n => {
      const m = meshObjects[n];
      if (m) m.material = new THREE.MeshStandardMaterial({
        color: 0x33aaff, transparent: true, opacity: 0.35, depthWrite: false
      });
    });
    setStatus(`Intersect "${resultName}": ${nameA} ∩ ${nameB} (preview)`);
  },

  removeObject(name) {
    const obj = meshObjects[name];
    if (obj) { scene.remove(obj); delete meshObjects[name]; }
    // Remove edge overlays created by addSketchPlane
    const edgeObj = scene.getObjectByName(name + '_edges');
    if (edgeObj) scene.remove(edgeObj);
  },

  setObjectVisible(name, visible) {
    const obj = meshObjects[name];
    if (obj) {
      obj.visible = visible;
      setStatus(visible ? `Showed "${name}"` : `Hid "${name}"`);
    }
  },

  clearScene() {
    Object.keys(meshObjects).forEach(k => {
      scene.remove(meshObjects[k]);
      delete meshObjects[k];
    });
    // Remove any orphaned edge overlays from sketch planes
    const orphans = [];
    scene.traverse(obj => { if (obj.name.endsWith('_edges')) orphans.push(obj); });
    orphans.forEach(obj => scene.remove(obj));
    if (_selectedMesh) { _applyHighlight(_selectedMesh, false); _selectedMesh = null; }
    setStatus('Scene cleared');
  },

  fitView() {
    const objects = Object.values(meshObjects);
    if (objects.length === 0) return;
    const box = new THREE.Box3();
    objects.forEach(o => box.expandByObject(o));
    const size   = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const dist   = maxDim / (2 * Math.tan((camera.fov * Math.PI / 180) / 2)) * 1.5;
    camera.position.set(center.x + dist * 0.6, center.y + dist * 0.5, center.z + dist * 0.8);
    controls.target.copy(center);
    controls.update();
  },

  resetView() {
    camera.position.set(200, 150, 300);
    controls.target.set(0, 0, 0);
    controls.update();
  },

  setView(preset) {
    const d = 250;
    const views = {
      front:  [0,    0,    d],
      back:   [0,    0,   -d],
      top:    [0,    d,    0.001],
      bottom: [0,   -d,    0.001],
      right:  [d,    0,    0],
      left:   [-d,   0,    0],
      iso:    [d*0.6, d*0.5, d*0.8],
    };
    const pos = views[preset] ?? views.iso;
    camera.position.set(...pos);
    controls.update();
    setStatus(`View: ${preset}`);
  },

  setWireframe(on) {
    isWireframe = on;
    Object.values(meshObjects).forEach(mesh => {
      mesh.material = on ? wireframeMaterial.clone() : defaultMaterial.clone();
    });
    // Re-apply selection highlight after material swap
    _applyHighlight(_selectedMesh, true);
    setStatus(on ? 'Wireframe on' : 'Solid view');
  },

  loadSTL(base64Data, name) {
    const binary = atob(base64Data);
    const buffer = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) buffer[i] = binary.charCodeAt(i);
    const geo = new STLLoader().parse(buffer.buffer);
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, defaultMaterial.clone());
    mesh.name = name;
    scene.add(mesh);
    meshObjects[name] = mesh;
    this.fitView();
    setStatus(`Loaded STL "${name}"`);
  },
};

// ── Helpers ───────────────────────────────────────────────────────────────────
function setStatus(msg) {
  statusEl.textContent = msg;
}

// ── Shared raycaster + cursor state ──────────────────────────────────────────
const _raycaster   = new THREE.Raycaster();
const _groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); // XZ at y=0
const _hitPoint    = new THREE.Vector3();
let _lastCursorMsg = 0;

// Applies or clears a selection highlight. Works in both solid (emissive) and
// wireframe (color shift) modes.
function _applyHighlight(mesh, on) {
  if (!mesh) return;
  if (mesh.material?.emissive) {
    mesh.material.emissive.set(on ? 0x224488 : 0x000000);
  } else if (mesh.material?.color) {
    if (on) {
      mesh.material._origHex = mesh.material.color.getHex();
      mesh.material.color.set(0x88aaff);
    } else if (mesh.material._origHex !== undefined) {
      mesh.material.color.set(mesh.material._origHex);
      delete mesh.material._origHex;
    }
  }
}

// ── Click-to-select → host app ────────────────────────────────────────────────
renderer.domElement.addEventListener('click', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
     ((e.clientX - rect.left) / rect.width)  * 2 - 1,
    -((e.clientY - rect.top)  / rect.height) * 2 + 1
  );
  _raycaster.setFromCamera(ndc, camera);
  const hits = _raycaster.intersectObjects(Object.values(meshObjects), false);
  const hit = hits.length > 0 ? hits[0].object : null;

  if (_selectedMesh !== hit) {
    _applyHighlight(_selectedMesh, false); // clear old
    _selectedMesh = hit;
    _applyHighlight(_selectedMesh, true);  // apply new
  }

  if (window.chrome?.webview) {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'select', name: hit?.name ?? null }));
  }
});
renderer.domElement.addEventListener('mousemove', (e) => {
  if (!window.chrome?.webview) return; // only in WebView2 host
  const now = Date.now();
  if (now - _lastCursorMsg < 100) return; // ~10 Hz
  _lastCursorMsg = now;

  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
     ((e.clientX - rect.left) / rect.width)  * 2 - 1,
    -((e.clientY - rect.top)  / rect.height) * 2 + 1
  );
  _raycaster.setFromCamera(ndc, camera);
  if (_raycaster.ray.intersectPlane(_groundPlane, _hitPoint)) {
    window.chrome.webview.postMessage(JSON.stringify({
      type: 'cursorPos',
      x: +_hitPoint.x.toFixed(1),
      y: +_hitPoint.y.toFixed(1),
      z: +_hitPoint.z.toFixed(1)
    }));
  }
});

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ── View cube ─────────────────────────────────────────────────────────────────
const _vcCanvas = document.getElementById('viewcube');
const _vcCtx    = _vcCanvas.getContext('2d');
const _vcSize   = 76;
const _vcCenter = _vcSize / 2;
const _vcRadius = 26;

const _vcAxes = [
  { dir: new THREE.Vector3( 1, 0, 0), neg: new THREE.Vector3(-1, 0, 0), color: '#e05555', label: 'X' },
  { dir: new THREE.Vector3( 0, 1, 0), neg: new THREE.Vector3( 0,-1, 0), color: '#55cc55', label: 'Y' },
  { dir: new THREE.Vector3( 0, 0, 1), neg: new THREE.Vector3( 0, 0,-1), color: '#5588ee', label: 'Z' },
];

function drawViewCube() {
  _vcCtx.clearRect(0, 0, _vcSize, _vcSize);

  // Faint background circle
  _vcCtx.beginPath();
  _vcCtx.arc(_vcCenter, _vcCenter, _vcRadius + 8, 0, Math.PI * 2);
  _vcCtx.fillStyle = 'rgba(10,20,35,0.72)';
  _vcCtx.fill();

  const vm = camera.matrixWorldInverse;

  // Project each axis + its negative end
  const lines = [];
  _vcAxes.forEach(a => {
    const p = a.dir.clone().applyMatrix4(vm);
    const n = a.neg.clone().applyMatrix4(vm);
    lines.push({ x: _vcCenter + p.x * _vcRadius, y: _vcCenter - p.y * _vcRadius,
                 nx: _vcCenter + n.x * _vcRadius, ny: _vcCenter - n.y * _vcRadius,
                 z: p.z, color: a.color, label: a.label });
  });
  lines.sort((a, b) => a.z - b.z); // back-to-front

  lines.forEach(l => {
    // Negative axis (dimmer)
    _vcCtx.beginPath();
    _vcCtx.moveTo(_vcCenter, _vcCenter);
    _vcCtx.lineTo(l.nx, l.ny);
    _vcCtx.strokeStyle = l.color + '44';
    _vcCtx.lineWidth = 1.5;
    _vcCtx.stroke();

    // Positive axis
    _vcCtx.beginPath();
    _vcCtx.moveTo(_vcCenter, _vcCenter);
    _vcCtx.lineTo(l.x, l.y);
    _vcCtx.strokeStyle = l.color;
    _vcCtx.lineWidth = 2;
    _vcCtx.stroke();

    // Label dot
    _vcCtx.beginPath();
    _vcCtx.arc(l.x, l.y, 7, 0, Math.PI * 2);
    _vcCtx.fillStyle = l.color + 'cc';
    _vcCtx.fill();
    _vcCtx.fillStyle = '#ffffff';
    _vcCtx.font = 'bold 9px sans-serif';
    _vcCtx.textAlign = 'center';
    _vcCtx.textBaseline = 'middle';
    _vcCtx.fillText(l.label, l.x, l.y);
  });
}

// Click on view cube → snap to the nearest axis view based on click position
_vcCanvas.addEventListener('click', (e) => {
  const rect = _vcCanvas.getBoundingClientRect();
  const cx = e.clientX - rect.left - _vcCenter;
  const cy = e.clientY - rect.top  - _vcCenter;

  // Find which axis label was closest to click point (in projected coords)
  const vm2 = camera.matrixWorldInverse;
  const candidates = [
    { dir: new THREE.Vector3( 1, 0, 0), view: 'right',  label: '+X' },
    { dir: new THREE.Vector3(-1, 0, 0), view: 'left',   label: '-X' },
    { dir: new THREE.Vector3( 0, 1, 0), view: 'top',    label: '+Y' },
    { dir: new THREE.Vector3( 0,-1, 0), view: 'bottom', label: '-Y' },
    { dir: new THREE.Vector3( 0, 0, 1), view: 'front',  label: '+Z' },
    { dir: new THREE.Vector3( 0, 0,-1), view: 'back',   label: '-Z' },
  ];
  let best = null, bestDist = Infinity;
  candidates.forEach(c => {
    const p = c.dir.clone().applyMatrix4(vm2);
    const px = p.x * _vcRadius, py = -p.y * _vcRadius;
    const d = Math.hypot(cx - px, cy - py);
    if (d < bestDist) { bestDist = d; best = c; }
  });

  const d = 250;
  const viewPositions = {
    front:  [0, 0, d],  back:   [0, 0, -d],
    top:    [0, d, 0.001], bottom: [0, -d, 0.001],
    right:  [d, 0, 0],  left:   [-d, 0, 0],
    iso:    [d*0.6, d*0.5, d*0.8],
  };
  const pos = best ? (viewPositions[best.view] ?? viewPositions.iso) : viewPositions.iso;
  camera.position.set(...pos);
  controls.target.set(0, 0, 0);
  controls.update();
});

// ── Render loop ───────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  drawViewCube();
}
animate();
setStatus('Ready');
</script>
</body>
</html>
