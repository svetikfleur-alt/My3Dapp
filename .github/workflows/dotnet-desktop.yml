name: Build My3DApp

on:
  push:
    branches: [ "main", "claude/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # .NET 10 preview — matches TargetFramework net10.0-windows
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore My3DApp.sln

      - name: Build (${{ matrix.configuration }})
        run: dotnet build My3DApp.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Publish self-contained (Release only)
        if: matrix.configuration == 'Release'
        run: >
          dotnet publish My3DApp.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/win-x64
          -p:PublishSingleFile=true

      - name: Upload artifacts (Release only)
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: My3DApp-win-x64
          path: publish/win-x64/
          retention-days: 14
